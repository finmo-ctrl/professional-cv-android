
name: Build Professional CV Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PROFESSIONAL_CV_FLUTTER_SOURCE.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable

      - name: Extract Flutter source
        run: |
          unzip -q PROFESSIONAL_CV_FLUTTER_SOURCE.zip -d source
          test -f source/Professional_CV_Flutter/pubspec.yaml

      - name: Generate Android project
        run: |
          flutter create --platforms=android \
            --org=com.professionalcv \
            --project-name=professional_cv \
            /tmp/professional_cv_android
          cp -R /tmp/professional_cv_android/android \
            source/Professional_CV_Flutter/android

      - name: Prepare Android manifest
        working-directory: source/Professional_CV_Flutter
        run: python3 scripts/prepare_android_manifest.py

      - name: Validate project
        working-directory: source/Professional_CV_Flutter
        run: python3 scripts/validate_project.py

      - name: Install packages
        working-directory: source/Professional_CV_Flutter
        run: flutter pub get

      - name: Analyze source code
        working-directory: source/Professional_CV_Flutter
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: source/Professional_CV_Flutter
        run: flutter test --no-pub

      - name: Build APK
        working-directory: source/Professional_CV_Flutter
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: professional-cv-android-debug-apk
          path: source/Professional_CV_Flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
